[project]
name = "dragon-glass"
version = "2.0.0"
description = "A browser for a folder of Markdown files."
authors = [{ name = "Matteo Massetti" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141,<1.0)",
    "uvicorn[standard] (>=0.52,<1.0)",
    "markdown (>=3.10,<4.0)",
    "pyyaml (>=6.0,<7.0)",
    "python-multipart (>=0.0.32,<0.1)",
    "openpyxl (>=3.1,<4.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
